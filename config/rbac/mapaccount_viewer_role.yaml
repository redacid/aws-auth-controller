# This rule is not used by the project aws-auth-controller-prozorro itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to aws-auth.prozorro.sale resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: aws-auth-controller-prozorro
    app.kubernetes.io/managed-by: kustomize
  name: mapaccount-viewer-role
rules:
- apiGroups:
  - aws-auth.prozorro.sale
  resources:
  - mapaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - aws-auth.prozorro.sale
  resources:
  - mapaccounts/status
  verbs:
  - get

# This rule is not used by the project aws-auth-controller-prozorro itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over aws-auth.prozorro.sale.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: aws-auth-controller-prozorro
    app.kubernetes.io/managed-by: kustomize
  name: mapaccount-admin-role
rules:
- apiGroups:
  - aws-auth.prozorro.sale
  resources:
  - mapaccounts
  verbs:
  - '*'
- apiGroups:
  - aws-auth.prozorro.sale
  resources:
  - mapaccounts/status
  verbs:
  - get

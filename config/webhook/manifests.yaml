---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-aws-auth-prozorro-sale-v1beta1-mapuser
  failurePolicy: Fail
  name: mmapuser-v1beta1.kb.io
  rules:
  - apiGroups:
    - aws-auth.prozorro.sale
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - mapusers
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-aws-auth-prozorro-sale-v1beta1-mapuser
  failurePolicy: Fail
  name: vmapuser-v1beta1.kb.io
  rules:
  - apiGroups:
    - aws-auth.prozorro.sale
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - mapusers
  sideEffects: None
